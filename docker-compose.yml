version: '3.8'

services:


  couchdb:
    image: couchdb:3.4.2
    container_name: couchdb_server
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    volumes:
      - couchdb_data:/opt/couchdb/data
    restart: always

volumes:
  rabbitmq_data:
  couchdb_data:
